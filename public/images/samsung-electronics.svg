<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" fill="none">
  <defs>
    <linearGradient id="samsungBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#034ea2" />
      <stop offset="100%" stop-color="#022859" />
    </linearGradient>
    <filter id="samsungGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Samsung Iconic Oval Badge -->
  <g transform="translate(6, 6)">
    <ellipse cx="62" cy="34" rx="60" ry="28" fill="url(#samsungBlueGrad)" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-8 62 34)" filter="url(#samsungGlow)" />
    <!-- White Samsung Lettermark inside Ellipse -->
    <text x="62" y="41" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="2.5" transform="rotate(-8 62 34)">SAMSUNG</text>
  </g>

  <!-- Typography Right Column -->
  <g transform="translate(142, 0)">
    <text x="0" y="34" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="900" letter-spacing="1.5">SAMSUNG</text>
    <text x="0" y="52" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="2.2">ELECTRONICS</text>
    <text x="0" y="67" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="1">PT SAMSUNG ELECTRONICS INDONESIA</text>
  </g>
</svg>

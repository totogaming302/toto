<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="fpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="fpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="fpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Freeport Emblem Mountain Silhouette -->
  <g transform="translate(6, 4)">
    <!-- Base Mountain Block (F-M geometry) -->
    <path d="M 8 64 L 8 20 L 32 20 L 32 38 L 54 38 L 54 48 L 32 48 L 32 64 Z" fill="url(#fpBlue)" />
    <path d="M 32 20 L 54 20 L 54 30 L 32 30 Z" fill="#7dd3fc" />
    <path d="M 54 64 L 54 30 L 74 30 L 85 48 L 96 30 L 116 30 L 116 64 L 98 64 L 98 44 L 89 58 L 81 58 L 72 44 L 72 64 Z" fill="url(#fpGold)" />
    <!-- Mining Apex Diamond -->
    <polygon points="43,8 53,18 43,28 33,18" fill="#10b981" filter="url(#fpGlow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(136, 0)">
    <text x="0" y="36" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5">FREEPORT</text>
    <text x="0" y="53" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="3.5">INDONESIA</text>
    <text x="0" y="67" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="1.2">PT FREEPORT INDONESIA</text>
  </g>
</svg>
